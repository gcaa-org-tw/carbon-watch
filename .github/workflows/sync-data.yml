name: Sync Data from Google Spreadsheet

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'all = every tab; fund = fund holdings tabs only'
        type: choice
        options:
          - all
          - fund
        default: all
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write
  actions: write

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Decide sync scope
        id: mode
        env:
          SYNC_EVENT: ${{ github.event_name }}
          SYNC_SCOPE: ${{ inputs.scope }}
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: npm run decide-sync-mode
      
      - name: Download raw data from Google Spreadsheet
        env:
          FUND_ONLY: ${{ steps.mode.outputs.fund_only }}
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: |
          if [ "$FUND_ONLY" = "true" ]; then
            npm run download-fund-data
          else
            npm run download-data
          fi

      - name: Rebuild all derived JSON
        # rebuild-data chains all 6 transforms (company, fund, coal, trend,
        # region-map, top-company-region). Calling it here keeps CI and local
        # runs in sync — when a new transform is added to package.json's
        # rebuild-data chain, CI picks it up automatically.
        env:
          FUND_ONLY: ${{ steps.mode.outputs.fund_only }}
        run: |
          if [ "$FUND_ONLY" = "true" ]; then
            npm run transform-fund-data
          else
            npm run rebuild-data
          fi
      
      - name: Commit and push changes
        id: commit
        env:
          FUND_ONLY: ${{ steps.mode.outputs.fund_only }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add raw-data/ app/assets/data/
          CHANGED=$(git diff --staged --name-only | wc -l | tr -d ' ')
          echo "Files changed: $CHANGED"

          if [ "${{ github.event_name }}" = "schedule" ] && [ "$FUND_ONLY" = "true" ] && git diff --staged --quiet -- app/assets/data/fund-period.json; then
            echo "Holdings quarter unchanged; nothing to publish"
            echo "- Files changed: $CHANGED (not committed: holdings quarter unchanged)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "- Files changed: $CHANGED" >> "$GITHUB_STEP_SUMMARY"

          # Check if there are any changes to commit
          if [ "$CHANGED" -eq 0 ]; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync data from Google Spreadsheet [skip ci]"
            git push origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
